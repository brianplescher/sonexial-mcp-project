version: "3.8"

services:
  sonexial-mcp:
    build: .
    container_name: sonexial-mcp
    ports:
      - "8080:8080"
    environment:
      - SONEXIAL_MCP_ENV=production
      - SONEXIAL_MCP_HOST=0.0.0.0
      - SONEXIAL_MCP_PORT=8080
      - DATABASE_URL=sqlite+aiosqlite:////app/data/sonexial.db
      - SONEXIAL_MCP_API_KEY=${SONEXIAL_MCP_API_KEY:-change-me}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
    volumes:
      - sonexial-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional PostgreSQL service (uncomment to use)
